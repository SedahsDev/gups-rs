name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 (check / unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Path deps need sibling checkouts in a real monorepo publish.
          # For multi-repo CI, use repository_dispatch or composite checkout of pmix/ucx/ucc.
          path: gups-rs

      - name: Note path dependencies
        run: |
          echo "gups-rs depends on path crates ../ucx-rs ../pmix-rs ../ucc-rs"
          echo "This workflow expects a workspace layout or additional checkouts."
          echo "Local Tier 0: cargo test / cargo check with those trees present."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Checkout openshmem-rs (added in Issue #11 fix)
      - name: Checkout openshmem-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/openshmem-rs
          ref: master
          path: openshmem-rs

      # When run from monorepo mirror with all crates present:
      - name: Unit tests (monorepo layout)
        if: hashFiles('../ucx-rs/Cargo.toml') != '' || hashFiles('ucx-rs/Cargo.toml') != ''
        working-directory: gups-rs
        run: |
          cargo test --lib || cargo test
        continue-on-error: true
