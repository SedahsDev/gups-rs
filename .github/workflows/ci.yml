name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # All five repositories are checked out below workflow/, making these paths
  # siblings as required by gups-rs/Cargo.toml.
  PMIX_PREFIX: ${{ github.workspace }}/pmix-install
  UCX_PREFIX: /usr
  UCC_PREFIX: ${{ github.workspace }}/ucc-install
  LD_LIBRARY_PATH: ${{ github.workspace }}/pmix-install/lib:${{ github.workspace }}/pmix-install/lib64:${{ github.workspace }}/ucc-install/lib:/usr/lib/x86_64-linux-gnu:/usr/lib

jobs:
  build-and-test:
    name: Build, test, lint, and format
    runs-on: ubuntu-24.04
    steps:
      # The path must be one level below a common parent. From workflow/gups-rs,
      # ../ucx-rs, ../pmix-rs, ../ucc-rs, and ../openshmem-rs then resolve to
      # these checkouts.
      - name: Check out gups-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/gups-rs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workflow/gups-rs

      - name: Check out ucx-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/ucx-rs
          ref: master
          path: workflow/ucx-rs

      - name: Check out pmix-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/pmix-rs
          ref: main
          path: workflow/pmix-rs

      - name: Check out ucc-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/ucc-rs
          ref: master
          path: workflow/ucc-rs

      - name: Check out openshmem-rs
        uses: actions/checkout@v4
        with:
          repository: SedahsDev/openshmem-rs
          ref: main
          path: workflow/openshmem-rs

      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake build-essential clang libclang-dev libevent-dev \
            libhwloc-dev libnuma-dev libtool pkg-config libucx-dev

      - name: Build OpenPMIx 6.1.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v6.1.0 https://github.com/openpmix/openpmix.git openpmix
          cd openpmix
          ./configure --prefix="$PMIX_PREFIX"
          make -j"$(nproc)"
          make install
          test -f "$PMIX_PREFIX/include/pmix.h"
          test -f "$PMIX_PREFIX/lib/libpmix.so" || test -f "$PMIX_PREFIX/lib64/libpmix.so"

      - name: Build UCC 1.8.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.8.0 https://github.com/openucx/ucc.git ucc
          cd ucc
          ./configure --prefix="$UCC_PREFIX" --with-ucx="$UCX_PREFIX"
          make -j"$(nproc)"
          make install
          test -f "$UCC_PREFIX/include/ucc/api/ucc.h" || test -f "$UCC_PREFIX/include/ucc.h"
          test -f "$UCC_PREFIX/lib/libucc.so"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo check all targets
        working-directory: workflow/gups-rs
        run: cargo check --all-targets

      - name: Unit tests
        working-directory: workflow/gups-rs
        run: cargo test --lib

      - name: Clippy
        working-directory: workflow/gups-rs
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt
        working-directory: workflow/gups-rs
        run: cargo fmt -- --check

      # The ignored multi-process tests require RDMA hardware and a PRRTE
      # daemon, so cargo test --lib intentionally exercises only single-node tests.
      # Native-library installation is deliberately a hard prerequisite: failures
      # above must stop the job, and no quality gate is conditionally skipped.
