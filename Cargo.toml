[package]
name = "gups-rs"
version = "0.1.0"
edition = "2024"
description = "GUPS (Global Update Performance) benchmark in Rust using UCX"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["gups", "hpc", "benchmark", "ucx"]
categories = ["science"]

[dependencies]
libc = "0.2"
# OpenSHMEM owns lifecycle and collectives; direct bindings remain only for the
# external Vec<u64> table fallback documented in comm.rs.
openshmem = { path = "../openshmem-rs" }
ucx-sys = { path = "../ucx-rs" }
pmix = { path = "../pmix-rs" }

[features]
default = ["ucc"]
ucc = ["dep:ucc", "openshmem/collectives"]

[dependencies.ucc]
path = "../ucc-rs"
optional = true
