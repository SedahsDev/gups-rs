# Portable defaults only. Set native lib prefixes via env (see sibling crates):
#   export UCX_PREFIX=... UCC_PREFIX=... PMIX_PREFIX=...
#   export LD_LIBRARY_PATH=$UCX_PREFIX/lib:$UCC_PREFIX/lib:$PMIX_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
# See .cargo/config.toml.example for optional local overrides.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
